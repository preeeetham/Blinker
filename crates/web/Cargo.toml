[package]
name = "blinker-web"
description = "Blinker UI: Leptos (SSR + hydration) served by the Axum backend"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { workspace = true, optional = true }
tower-http = { version = "0.6", features = ["compression-gzip", "trace"], optional = true }
blinker-server = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
dotenvy = { version = "0.15", optional = true }

serde.workspace = true
serde_json.workspace = true
base64.workspace = true
bs58.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Navigator", "Clipboard", "Element", "HtmlElement", "DomRect", "MouseEvent", "Location", "Storage"] }
gloo-net = { version = "0.6", features = ["http", "json"] }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:tower-http",
    "dep:leptos_axum",
    "dep:blinker-server",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:dotenvy",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]
