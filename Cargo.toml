[workspace]
resolver = "3"
members = [
    "crates/solana",
    "crates/eventlog",
    "crates/analytics",
    "crates/server",
    "crates/web",
    "crates/cli",
]
exclude = ["fuzz"]
default-members = ["crates/solana", "crates/eventlog", "crates/analytics", "crates/server", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
blinker-solana = { path = "crates/solana" }
blinker-eventlog = { path = "crates/eventlog" }
blinker-analytics = { path = "crates/analytics" }
blinker-server = { path = "crates/server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rand = "0.9"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only" # keeps symbols for flamegraphs without bloating

# Profile used for the WASM bundle: optimise for size.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
debug = false
panic = "abort"

# Profile for perf work: release speed + full symbols.
[profile.profiling]
inherits = "release"
debug = true

[[workspace.metadata.leptos]]
name = "blinker"
bin-package = "blinker-web"
lib-package = "blinker-web"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "crates/web/style/main.css"
assets-dir = "assets"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
